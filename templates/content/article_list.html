{% extends "base.html" %}

{% block title %}Articles{% endblock %}

{% block content %}
    <div class="container mx-auto py-8 px-4">
        <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">
            Recent Articles
        </h2>

        <div class="max-w-md mx-auto mt-6 flex flex-row gap-4 mb-10">
                <a href="" class="flex-1">
                    <p class="px-6 py-3 bg-gray-200 text-gray-800 rounded-md text-center hover:bg-gray-300 transition">
                        Create Article
                    </p>
                </a>
            </div>

        <div class="max-w-2xl mx-auto">
            {% for article in articles %}
                <a href="{% url 'article_detail' article.id %}"
                   class="block mb-4 p-4 bg-white rounded border border-gray-200 hover:bg-gray-50 transition">
                    <h3 class="font-medium text-lg text-gray-800">
                        {{ article.title }}
                    </h3>

                    <div class="flex items-center mt-2 text-sm text-gray-600">
                        <span>{{ article.author }}</span>
                        <span class="mx-2">•</span>
                        <span>{{ article.created|date:"M d, Y" }}</span>
                    </div>
                </a>
            {% empty %}
                <div class="text-center py-10">
                    <p class="text-gray-500">No articles available yet.</p>
                </div>
            {% endfor %}
        </div>
    </div>
{% endblock %}
