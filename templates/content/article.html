{% extends "base.html" %}

{% block title %}{{ article.title }}{% endblock %}

{% block content %}
    <div class="container mx-auto px-4 py-8">
        <article class="max-w-2xl mx-auto bg-white p-6 rounded shadow">
            <h1 class="text-3xl font-bold text-gray-800 mb-3">{{ article.title }}</h1>

            <div class="flex flex-col mb-6 pb-4 border-b border-gray-200">
                <div class="text-gray-600">
                    <span class="text-sm">autor: <span class="font-medium text-gray-800">{{ article.author }}</span></span>
                </div>
                <div class="text-gray-600 mt-1">
                    <span class="text-sm">publikované <span class="font-medium text-gray-800">{{ article.published_date|date:"j. F Y" }}</span></span>
                </div>
            </div>

            <div class="prose max-w-none">
                {{ article.content|safe }}
            </div>
        </article>
    </div>
{% endblock %}
