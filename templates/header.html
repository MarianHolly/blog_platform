<header class="border-b-1 border-gray-200">
    <div class="max-w-screen-xl flex items-center justify-between mx-auto p-4">

        <a href="{% url 'home' %}">
            <span class="self-center text-2xl font-semibold">Blog Platform</span>
        </a>
        <div class="flex flex-row gap-4">
            <div class="font-medium flex flex-row rounded-lg gap-2">
                <a href="{% url 'home' %}" class="text-blue-950 hover:bg-gray-100 py-2 px-4 rounded-md">Domov</a>
                <a href="{% url 'about' %}" class="text-blue-950 hover:bg-gray-100 py-2 px-4 rounded-md">O nás</a>
            </div>
            <div class="font-medium flex flex-row rounded-lg gap-2 items-center">
                {% if user.is_authenticated %}
                    <a href="{% url 'profile' user.id %}" class="text-blue-100 bg-gray-900 hover:bg-gray-700 py-2 px-4 rounded-md">{{ user.username }}</a>
                    <a href="{% url 'logout' %}" class="text-blue-100 bg-gray-900 hover:bg-gray-700 py-2 px-4 rounded-md">Odhlásenie</a>
                {% else %}
                    <a href="{% url 'login' %}" class="text-blue-100 bg-gray-900 hover:bg-gray-700 py-2 px-4 rounded-md">Prihlásenie</a>
                    <a href="{% url 'signup' %}" class="text-blue-100 bg-gray-900 hover:bg-gray-700 py-2 px-4 rounded-md">Registrácia</a>
                {% endif %}
            </div>
        </div>
    </div>
</header>
