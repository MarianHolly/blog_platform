{% if is_paginated %}
<div class="flex justify-center items-center mt-8 space-x-4">
    <!-- Previous Button -->
    {% if page_obj.has_previous %}
        <a href="?page={{ page_obj.previous_page_number }}{% for key, value in request.GET.items %}{% if key != 'page' %}&{{ key }}={{ value }}{% endif %}{% endfor %}" 
           class="px-3 py-1 bg-white border border-gray-300 rounded-md hover:bg-gray-50 text-gray-700 text-sm">
            ← Predchádzajúca
        </a>
    {% else %}
        <span class="px-3 py-1 bg-gray-100 border border-gray-200 rounded-md text-gray-400 cursor-not-allowed text-sm">
            ← Predchádzajúca
        </span>
    {% endif %}

    <!-- Page Info -->
    <span class="px-4 py-2 bg-gray-600 text-white rounded-md">
        {{ page_obj.number }} z {{ page_obj.paginator.num_pages }}
    </span>

    <!-- Next Button -->
    {% if page_obj.has_next %}
        <a href="?page={{ page_obj.next_page_number }}{% for key, value in request.GET.items %}{% if key != 'page' %}&{{ key }}={{ value }}{% endif %}{% endfor %}" 
           class="px-3 py-1 bg-white border border-gray-300 rounded-md hover:bg-gray-50 text-gray-700 text-sm">
            Nasledujúca →
        </a>
    {% else %}
        <span class="px-3 py-1 bg-gray-100 border border-gray-200 rounded-md text-gray-400 cursor-not-allowed text-sm">
            Nasledujúca →
        </span>
    {% endif %}
</div>
{% endif %}
