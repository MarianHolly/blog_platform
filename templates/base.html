{% load static %}

<!DOCTYPE html>
<html {% if LANGUAGE_CODE %} lang="{{ LANGUAGE_CODE }}" {% else %} lang="sk" {% endif %}>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/article-content.css' %}">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        .django-ckeditor-widget {
      width: inherit;
    }
</style>
</head>
<body class="min-h-screen bg-gray-50">
    {% include 'header.html' %}

    <div class="container max-w-screen-xl mx-auto">
        {% block content %}{% endblock %}
    </div>

   {% if messages %}
        <div class="messages">
            {% for message in messages %}
            <div class="{% if message.tags == 'success' %}bg-green-100 text-green-700 border-green-200
                        {% elif message.tags == 'warning' %}bg-yellow-100 text-yellow-700 border-yellow-200
                        {% elif message.tags == 'error' %}bg-red-100 text-red-700 border-red-200
                        {% else %}bg-blue-100 text-blue-700 border-blue-200{% endif %} px-4 py-3 text-center rounded-md border mb-4">
                {{ message }}
            </div>
            {% endfor %}
        </div>
    {% endif %}
</body>
</html>
