{% extends "base.html" %}

{% block title %}Zmazať článok{% endblock %}

{% block content %}
    <div class="container mx-auto py-8 px-4">
        <div class="max-w-md mx-auto">
            <div class="bg-white rounded shadow p-6 text-center">

                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                     stroke="currentColor" class="size-12 text-red-600 mx-auto mb-4">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0"/>
                </svg>

                <h2 class="text-xl font-bold mb-4">Vymazať článok</h2>

                <p class="mb-6 text-gray-600 font-light">
                    Naozaj chcete odstrániť "<span class="font-medium">{{ object.title }}</span>"?
                    <br>Túto akciu nie je možné vrátiť späť.
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="flex justify-center space-x-4">
                        <button type="button" onclick="history.back()"
                                class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
                            Zrušiť
                        </button>
                        <button type="submit" class="px-4 py-2 bg-red-600 text-white rounded-md hover:bg-red-700">
                            Vymazať
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
